# DigitalOcean App Platform spec: runs the published image from Docker Hub
# behind App Platform's HTTPS. HTTPS is not optional -- PKCE needs a secure
# context, so a plain-HTTP deployment on a public address cannot sign in.
#
# The defaults point at the public SMART App Launcher sandbox, so the app
# works for anyone who opens it; visitors can point it elsewhere on the
# Config screen. To change the defaults for everyone, create the app once and
# then edit the environment variables in the control panel
# (Settings -> swiss -> Environment Variables):
#
#   doctl apps create --spec .do/app.yaml
#
# Do not re-apply this file to a running app with `doctl apps update`: it
# would reset any variables edited in the control panel to the values below. New releases are
# deployed by .github/workflows/release.yml once DO_APP_ID is set (README,
# "DigitalOcean App Platform").
name: swiss-on-fhir
region: tor
services:
  - name: swiss
    image:
      registry_type: DOCKER_HUB
      registry: omarhoblos
      repository: swiss-on-fhir
      # Every 3.x release moves this tag, and each deployment pulls it afresh.
      tag: '3'
    # The image runs nginx unprivileged on 8080.
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /
    # Read by the entrypoint at startup, exactly like --env-file. Values are
    # taken literally: do not quote them. CLIENT_SECRET is left out on
    # purpose, since /swiss-env.json is readable by anyone who visits.
    envs:
      # SMART App Launcher: public, CORS-enabled, and accepts any client ID
      # with PKCE, which is why CLIENT_ID can stay as swiss.
      - key: FHIRENDPOINT_URI
        value: https://launch.smarthealthit.org/v/r4/fhir
        scope: RUN_TIME
      - key: ISSUER_URI
        value: https://launch.smarthealthit.org/v/r4/fhir
        scope: RUN_TIME
      - key: CLIENT_ID
        value: swiss
        scope: RUN_TIME
      - key: SCOPES
        value: openid fhirUser offline_access launch launch/patient patient/*.read patient/*.write
        scope: RUN_TIME
      # Add an EHR's origin here to show Swiss inside its frame.
      - key: FRAME_ANCESTORS
        value: self
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: swiss
      match:
        path:
          prefix: /
