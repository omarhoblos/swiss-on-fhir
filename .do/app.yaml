# DigitalOcean App Platform spec: runs the published image from Docker Hub
# behind App Platform's HTTPS. HTTPS is not optional -- PKCE needs a secure
# context, so a plain-HTTP deployment on a public address cannot sign in.
#
# The defaults point at a test bed on the visitor's own machine: a FHIR server
# on port 8000 and its authorization server on 9200, as in .env.example. Swiss
# runs in the browser, so localhost is the visitor's machine, not the app's.
# Visitors can point it elsewhere on the Config screen. To change the defaults
# for everyone, create the app once and then edit the environment variables in
# the control panel (Settings -> omarhoblos-swiss-on-fhir -> Environment
# Variables):
#
#   doctl apps create --spec .do/app.yaml
#
# Do not re-apply this file to a running app with `doctl apps update`: it
# would reset any variables edited in the control panel to the values below. New releases are
# deployed by .github/workflows/release.yml once the repository variable
# DO_APP_ID and the secret DIGITALOCEAN_ACCESS_TOKEN are set.
name: swiss-on-fhir
region: tor
# Email the account when a deployment or the app's domain fails.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: omarhoblos-swiss-on-fhir
    image:
      registry_type: DOCKER_HUB
      registry: omarhoblos
      repository: swiss-on-fhir
      # Every 3.x release moves this tag, and each deployment pulls it afresh.
      tag: '3'
    # The image runs nginx unprivileged on 8080.
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /
    # Read by the entrypoint at startup, exactly like --env-file. Values are
    # taken literally: do not quote them. CLIENT_SECRET is left out on
    # purpose, since /swiss-env.json is readable by anyone who visits.
    envs:
      # CLIENT_ID swiss is the public client the local test bed registers.
      # To default to the public SMART App Launcher instead, which accepts any
      # client ID and redirect URI with PKCE, point FHIRENDPOINT_URI at a
      # launcher base with a /sim/ segment: base64url JSON such as
      # [3,"","","AUTO",0,0,0,"","","","","","","",0,1,""], a standalone patient
      # launch where you pick the patient. The bare /v/r4/fhir base answers
      # discovery but rejects every launch.
      - key: FHIRENDPOINT_URI
        value: http://localhost:8000
        scope: RUN_TIME
      - key: ISSUER_URI
        value: http://localhost:9200
        scope: RUN_TIME
      - key: CLIENT_ID
        value: swiss
        scope: RUN_TIME
      - key: SCOPES
        value: openid fhirUser offline_access launch launch/patient patient/*.read patient/*.write
        scope: RUN_TIME
      # Swiss itself and the public SMART test launcher. Add an EHR's origin
      # here to show Swiss inside its frame; use just self to allow neither.
      - key: FRAME_ANCESTORS
        value: self https://launch.smarthealthit.org
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: omarhoblos-swiss-on-fhir
      match:
        path:
          prefix: /
