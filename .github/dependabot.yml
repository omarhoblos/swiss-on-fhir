version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # One PR for the SvelteKit/Vite/Svelte set: they have interlocking peer
      # ranges and updating them individually tends to produce unmergeable PRs.
      svelte:
        patterns:
          - '@sveltejs/*'
          - 'svelte'
          - 'svelte-*'
          - 'vite'
          - 'vitest'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'

  # The v2 config never covered Actions, which is why checkout@v2 and
  # codeql-action@v1 sat in main long after both were deprecated.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
