name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries are run against code that has not changed.
    - cron: '39 16 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # `actions` scans these workflow files themselves, for things like
        # untrusted input reaching a run step.
        language: ['javascript-typescript', 'actions']

    steps:
      - uses: actions/checkout@v7

      # Neither language is compiled, so there is nothing to build: the old
      # template's Autobuild step did nothing here.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
