name: Docker Image Build Test CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build image and verify configuration is applied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single platform with load:true. The v2 workflow ran a two-platform
          # QEMU build with neither --push nor --load, so it took ~10 minutes
          # and retained nothing.
          platforms: linux/amd64
          load: true
          tags: swiss-on-fhir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container with a known .env
        run: |
          set -euo pipefail
          cat > ci.env <<'EOF'
          FHIRENDPOINT_URI=http://fhir.ci.test:8000
          ISSUER_URI=http://idp.ci.test:9200
          CLIENT_ID=ci-client
          CLIENT_SECRET=
          SCOPES=openid fhirUser launch/patient patient/*.read
          SKIP_ISSUER_CHECK=false
          EOF
          docker run -d -p 4200:80 --env-file ci.env --name swiss_ci swiss-on-fhir:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4200/swiss-env.json >/dev/null 2>&1; then break; fi
            sleep 1
          done

      # This is the regression test for the bug at v2 HEAD, where the
      # Dockerfile lost its envsubst step and --env-file silently did nothing.
      - name: Assert .env reached the app
        run: |
          set -euo pipefail
          cfg=$(curl -fsS http://localhost:4200/swiss-env.json)
          echo "$cfg"
          jq -e '.authIssuer  == "http://idp.ci.test:9200"'  <<<"$cfg" >/dev/null
          jq -e '.fhirBaseUrl == "http://fhir.ci.test:8000"' <<<"$cfg" >/dev/null
          jq -e '.clientId    == "ci-client"'                <<<"$cfg" >/dev/null
          if grep -q '\${' <<<"$cfg"; then
            echo "An unsubstituted placeholder survived: envsubst did not run."
            exit 1
          fi

      - name: Assert the runtime config is not cacheable
        # Without no-store, changing .env and recreating the container leaves
        # the browser serving the old values from cache.
        run: |
          set -euo pipefail
          curl -fsSI http://localhost:4200/swiss-env.json | tee /dev/stderr | grep -qi 'cache-control: no-store'

      - name: Assert the app shell and SPA fallback work
        run: |
          set -euo pipefail
          # index.html at the served root: the v2 output-path bug 404'd here.
          curl -fsS http://localhost:4200/ | grep -q 'sveltekit' \
            || { echo "The app shell did not render"; exit 1; }
          # Deep routes must resolve through try_files on a cold load.
          for path in /config /diagnostics /launch /fhir /callback; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4200${path}")
            [ "$code" = "200" ] || { echo "$path returned $code, expected 200"; exit 1; }
          done

      - name: Container logs on failure
        if: failure()
        run: docker logs swiss_ci || true

      - name: Tear down
        if: always()
        run: docker rm -f swiss_ci || true
