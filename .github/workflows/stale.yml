# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '35 23 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      # v3 ran on a Node runtime GitHub has since removed. repo-token now
      # defaults to the workflow token, so it no longer needs passing.
      - uses: actions/stale@v11
        with:
          stale-issue-message: 'This issue has had no activity for a while. It will close soon if nothing further happens; comment to keep it open.'
          stale-pr-message: 'This pull request has had no activity for a while. It will close soon if nothing further happens; comment or push to keep it open.'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
