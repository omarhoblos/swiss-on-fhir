# Builds Swiss from source and runs it on http://localhost:4200.
#
#   docker compose up -d --build   build and start
#   docker compose down --rmi local   stop, and remove the container and image
#
# To run the published image instead, see the README; this file always
# builds from the working tree.
services:
  swiss:
    build: .
    image: swiss-on-fhir:local
    container_name: swiss_app
    ports:
      # Loopback only by default: Swiss is plain HTTP, /swiss-env.json may
      # hold a client secret, and PKCE only works from localhost anyway.
      # SWISS_BIND=0.0.0.0 publishes on every interface, for a reverse proxy
      # on another host. SWISS_PORT=8080 when 4200 is taken; if you change
      # it, register http://localhost:<port>/callback instead.
      - '${SWISS_BIND:-127.0.0.1}:${SWISS_PORT:-4200}:8080'
    # Read by the container at startup, not baked into the image: the
    # entrypoint renders it into /swiss-env.json. Changing it needs the
    # container recreated, which `docker compose up -d` does on its own.
    env_file: .env
    restart: unless-stopped
