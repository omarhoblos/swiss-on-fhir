# In front of Inferno for the conformance runs only.
#
# Swiss runs in the browser, so every request it makes to Inferno's simulated
# SMART server is cross-origin. Inferno answers a CORS preflight with 405 and
# sends Access-Control-Allow-Origin on some responses only, so this proxy
# answers preflights itself and sets one consistent set of CORS headers,
# hiding Inferno's own to avoid a duplicate the browser would reject.
# Never put this in front of anything real.
server {
  listen 80;

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Prefer" always;
      add_header Access-Control-Max-Age 600 always;
      add_header Vary Origin always;
      return 204;
    }

    proxy_pass http://inferno:4567;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 600s;

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers "*" always;
    add_header Vary Origin always;
  }
}
