# The default log format records the whole request line, query string
# included -- and /callback?code=...&state=... and /launch?iss=...&launch=...
# are exactly the requests this app receives. The browser strips them from
# its own URL, but only after nginx has already logged them. Log the path
# alone. A `map` rather than `access_log off` in a location block, because
# the SPA fallback is an internal redirect and the log phase uses the final
# location's settings.
map $request_uri $request_path {
  ~^(?<path>[^?]*) $path;
}
log_format swiss '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $request_path $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log swiss;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # The runtime config MUST NOT be cached. Without this the browser keeps
  # serving the previous values, and "edit .env, recreate the container,
  # refresh" -- the workflow the README promises -- silently does nothing.
  location = /swiss-env.json {
    default_type application/json;
    add_header Cache-Control "no-store, must-revalidate" always;
    include /etc/nginx/snippets/swiss-security-headers.conf;
  }

  # Everything SvelteKit puts here is content-hashed.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/swiss-security-headers.conf;
  }

  # The shell itself must revalidate, or a new deploy is never picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/swiss-security-headers.conf;
  }

  # Security headers are NOT set here: see security-headers.conf for why
  # every location block includes them instead.

  # SPA fallback, matching adapter-static's fallback: 'index.html'. This is
  # what lets /callback, /launch and /config resolve on a cold load.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/swiss-security-headers.conf;
  }
}
